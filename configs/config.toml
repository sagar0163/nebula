# Nebula configuration file
# Default location: ~/.config/nebula/config.toml
# Override with: --config <path> or NEBULA_CONFIG env var

[agent]
dry_run = false
skip_permissions = false
max_heal_retries = 3
session_dir = "~/.local/share/nebula/sessions"
agent_history_depth = 10
agent_file_injection = true

[llm]
# Primary provider: "gemini" | "groq" | "ollama" | "openai"
primary = "groq"
# Fallback provider when primary is unavailable
fallback = "ollama"
# Race this many providers concurrently and keep the first response
# (default 2, max 3). Set to 1 for strictly sequential failover.
# Every extra provider in the race is a second billable request that gets
# cancelled mid-flight, so raising it trades cost for latency.
parallel_fanout = 2
# Per-attempt completion timeout in seconds (default 60)
timeout_seconds = 60

[llm.groq]
# Set via NEBULA_LLM_GROQ_API_KEY or keyring
api_key = ""
# Workload-specialized models
model_diagnose = "llama-3.1-8b-instant"   # fast, cheap — failure analysis
model_heal     = "llama-3.3-70b-versatile" # mid-tier — fix suggestions
model_learn    = "llama-3.3-70b-versatile" # strong — workflow learning
model_embed    = ""                          # Groq has no embed endpoint; falls back to Ollama

[llm.gemini]
api_key = ""
model_diagnose = "gemini-2.0-flash"
model_heal     = "gemini-2.5-pro"
model_learn    = "gemini-2.5-pro"
model_embed    = "text-embedding-004"

[llm.ollama]
base_url = "http://localhost:11434"
model_diagnose = "llama3.2:3b"
model_heal     = "llama3.2"
model_learn    = "llama3.1:70b"
model_embed    = "nomic-embed-text"

[llm.mistral]
api_key = ""
model_diagnose = "open-mistral-nemo"
model_heal     = "mistral-large-latest"
model_learn    = "mistral-large-latest"
model_embed    = "mistral-embed"

[llm.nvidia]
api_key = ""
model_diagnose = "nvidia/llama-3.1-nemotron-70b-instruct"
model_heal     = "meta/llama-3.1-405b-instruct"
model_learn    = "meta/llama-3.1-405b-instruct"
model_embed    = "nvidia/nv-embedqa-e5-v5"

[memory]
db_path = "~/.local/share/nebula/nebula.db"
# Max ring buffer size in bytes kept in memory for AI context
ring_buffer_size = 32768  # 32KB

[safety]
# Default policy per risk level: "allow" | "ask" | "deny"
policy_safe      = "allow"
policy_low       = "allow"
policy_medium    = "ask"
policy_high      = "ask"
policy_dangerous = "deny"
# Audit log path — append-only record of every AI suggestion + user decision
audit_log = "~/.local/share/nebula/audit.log"

[tui]
theme = "auto"  # "auto" | "light" | "dark"

# MCP server connections
# [[mcp.servers]]
# name = "filesystem"
# type = "stdio"
# command = "npx -y @modelcontextprotocol/server-filesystem ~"
