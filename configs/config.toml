# command = "npx -y @modelcontextprotocol/server-github"
# [mcp.servers.env]
# GITHUB_PERSONAL_ACCESS_TOKEN = ""

[pty]
# Maximum amount of bytes to capture from a command's output (default 512KB)
capture_kb = 512
# Ring buffer size kept in memory for AI context (default 256KB)
ring_kb = 256
